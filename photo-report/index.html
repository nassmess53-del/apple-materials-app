
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Photo Report</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  font-family: -apple-system, Arial, sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
}
h1 { font-size: 25px; margin-bottom: 6px; }
p { color: #666; }
.card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-top: 18px;
}
select, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
}
select { border: 1px solid #ddd; }
button {
  border: none;
  background: #007aff;
  color: white;
  margin-top: 12px;
  cursor: pointer;
}
.photo {
  border: 2px dashed #ccc;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  margin-top: 12px;
}
.photo img {
  max-width: 100%;
  max-height: 240px;
  border-radius: 8px;
}
input[type=file] { display: none; }
</style>
</head>
<body>

<h1>Apple Photo Report</h1>
<p>Ежемесячный фотоотчёт бренд-зоны</p>

<div class="card">
  <h3>Выберите магазин</h3>
  <select id="store">
    <option value="">Выберите магазин</option>
    <option value="2922127">COMFY LAVYNA</option>
    <option value="3381659">ALLO RETROVILLE</option>
    <option value="1657057">CITRUS SKY MALL</option>
  </select>
</div>

<div class="card">
  <h3>Этап 1. Общий вид бренд-зоны</h3>
  <p>Добавьте 4 фотографии с разных углов.</p>
  <div id="photos"></div>
  <button id="next" disabled>Следующий этап</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const names = [
  "Левый угол",
  "Правый угол",
  "Вид спереди",
  "Общий план"
];

const selected = new Array(4).fill(false);
const container = document.getElementById("photos");
const next = document.getElementById("next");

names.forEach((name, index) => {
  const card = document.createElement("div");
  card.className = "photo";

  const title = document.createElement("p");
  title.textContent = name;
  card.appendChild(title);

  const preview = document.createElement("img");
  preview.hidden = true;
  card.appendChild(preview);

  const camera = document.createElement("input");
  camera.type = "file";
  camera.accept = "image/*";
  camera.setAttribute("capture", "environment");

  const gallery = document.createElement("input");
  gallery.type = "file";
  gallery.accept = "image/*";

  function choose(file) {
    if (!file || !file.type.startsWith("image/")) return;
    if (preview.dataset.url) {
      URL.revokeObjectURL(preview.dataset.url);
    }
    const url = URL.createObjectURL(file);
    preview.dataset.url = url;
    preview.src = url;
    preview.hidden = false;
    selected[index] = true;
    next.disabled = !selected.every(Boolean);
  }

  camera.onchange = () => choose(camera.files[0]);
  gallery.onchange = () => choose(gallery.files[0]);

  const cameraButton = document.createElement("button");
  cameraButton.textContent = "📷 Камера";
  cameraButton.onclick = () => camera.click();

  const galleryButton = document.createElement("button");
  galleryButton.textContent = "🖼 Галерея";
  galleryButton.onclick = () => gallery.click();

  card.append(camera, gallery, cameraButton, galleryButton);
  container.appendChild(card);
});

next.onclick = () => {
  if (!document.getElementById("store").value) {
    alert("Сначала выберите магазин");
    return;
  }
  alert("Первый этап заполнен!");
};
</script>

</body>
</html>
