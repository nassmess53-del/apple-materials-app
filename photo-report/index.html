function fileToBase64(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=()=>reject(new Error('Не вдалося прочитати файл'));
reader.onload=()=>resolve(String(reader.result).split(',')[1]);
reader.readAsDataURL(file);
});
}
async function apiPost(path,payload){
const response=await fetch(API_URL+path,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(payload)
});
let data;
try{data=await response.json()}catch{throw new Error('Сервер повернув некоректну відповідь')}
if(!response.ok||!data.success)throw new Error(data.error||`Помилка сервера (${response.status})`);
return data;
}

back.disabled=true;

const {file,step,number}=files[i];
status.textContent=`Завантаження ${i+1} із ${files.length}…`;
const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').slice(0,8)||'jpg';
const fileName=`Етап_${step}_Фото_${number}.${ext}`;
await apiPost('/upload',{
initData,
storeName:label(state.store),
reportDate,
fileName,
mimeType:file.type||'image/jpeg',
base64Data:await fileToBase64(file)
});
}
state.screen='done';
render();
}catch(error){
status.textContent=`Не вдалося завершити надсилання: ${error.message}. Частина файлів могла вже завантажитися. Не натискайте повторно без перевірки.`;
button.disabled=false;
back.disabled=false;
}
}

function showStores(query){const q=query.trim().toLocaleLowerCase();const matches=STORES.filter(s=>label(s).toLocaleLowerCase().includes(q)).sort((a,b)=>label(a).localeCompare(label(b),'uk')).slice(0,50);const el=document.getElementById('storeResults');el.innerHTML=matches.map(s=>`<button type="button" data-id="${s.id}">${esc(label(s))}</button>`).join('')||'<p class="muted" style="padding:10px">Магазин не знайдено</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.store=STORES.find(s=>s.id===b.dataset.id);document.getElementById('storeSearch').value=label(state.store);document.getElementById('selected').classList.remove('hidden');document.getElementById('selected').textContent=label(state.store);document.getElementById('goRules').disabled=false;el.innerHTML=''});}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}render();
</script></body></html>
