function fileToBase64(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=()=>reject(new Error('Не вдалося прочитати файл'));
reader.onload=()=>resolve(String(reader.result).split(',')[1]);
reader.readAsDataURL(file);
});
}
// Параметри якості. 0.90 — якість JPEG, а не зменшення розміру на 90%.
const PHOTO_MAX_WIDTH=3024;
const PHOTO_MAX_HEIGHT=2268;
const PHOTO_JPEG_QUALITY=0.90;
const preparedPhotoCache=new WeakMap();

// Етапи 1–3 та 5 оптимізуються. Close-up (4) і DCOTA (6) — оригінали.
async function preparePhoto(file,step){
  if(step===4||step===6||!['image/jpeg','image/png','image/webp'].includes(file.type))return file;
  if(preparedPhotoCache.has(file))return preparedPhotoCache.get(file);
  const task=(async()=>{
    let bitmap;
    try{
      bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
      const scale=Math.min(1,PHOTO_MAX_WIDTH/bitmap.width,PHOTO_MAX_HEIGHT/bitmap.height);
      if(scale>=1)return file;
      const width=Math.max(1,Math.round(bitmap.width*scale));
      const height=Math.max(1,Math.round(bitmap.height*scale));
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      if(!ctx)throw new Error('Canvas недоступний');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(bitmap,0,0,width,height);
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(
        result=>result?resolve(result):reject(new Error('Не вдалося підготувати JPEG')),
        'image/jpeg',PHOTO_JPEG_QUALITY
      ));
      canvas.width=0;canvas.height=0;
      // Якщо оптимізація не зменшує файл, зберігаємо оригінал.
      if(blob.size>=file.size)return file;
      return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{
        type:'image/jpeg',lastModified:file.lastModified
      });
    }catch(error){
      console.warn('Оптимізація недоступна, використовується оригінал:',error);
      return file;
    }finally{if(bitmap)bitmap.close()}
  })();
  preparedPhotoCache.set(file,task);
  return task;
}

async function apiPost(path,payload,timeoutMs=55000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const response=await fetch(API_URL+path,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),signal:controller.signal
    });
    let data;
    try{data=await response.json()}
    catch{throw Object.assign(new Error('Сервер повернув некоректну відповідь'),{retryable:response.status>=500})}
    if(!response.ok||!data.success){
      throw Object.assign(new Error(data.error||`Помилка сервера (${response.status})`),{
        retryable:data.retryable===true||response.status===429||response.status>=500,
        status:response.status
      });
    }
    return data;
  }catch(error){
    if(error.name==='AbortError')throw Object.assign(new Error('Час очікування відповіді минув'),{retryable:true});
    if(error instanceof TypeError)throw Object.assign(new Error('Помилка мережі'),{retryable:true});
    throw error;
  }finally{clearTimeout(timer)}
}

// Унікальний ID залишається тим самим під час усіх повторів конкретного файлу.
const uploadedFiles=new Map();
const uploadIdentifiers=new Map();
let reportDateForUpload=null;
// Один ID для всього фотозвіту, незмінний під час повторних спроб.
let reportIdForUpload=null;
let uploadInProgress=false;
// Обмежуємо навантаження на Apps Script. Після тестів параметр можна змінити.
const PARALLEL_UPLOADS=2;
const MAX_ATTEMPTS=3;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function uploadIdFor(key,file){
  const saved=uploadIdentifiers.get(key);
  if(saved&&saved.file===file)return saved.id;
  const id=crypto.randomUUID().replace(/-/g,'');
  uploadIdentifiers.set(key,{file,id});
  uploadedFiles.delete(key);
  return id;
}
async function sendReport(){
  const button=document.getElementById('sendReport');
  const status=document.getElementById('sendStatus');
  const back=document.getElementById('backReview');
  if(!button||uploadInProgress)return;
  const initData=window.Telegram?.WebApp?.initData||'';
  if(!initData){status.textContent='Відкрийте фотозвіт через кнопку в Telegram.';return}
  const files=state.photos.flatMap((group,i)=>
    group.map((file,j)=>file?{file,step:i+1,number:j+1,key:`${i+1}:${j+1}`}:null).filter(Boolean)
  );
  if(!files.length){status.textContent='Спочатку додайте фотографії.';return}
  uploadInProgress=true;
  button.disabled=true;back.disabled=true;
  root.querySelectorAll('[data-edit]').forEach(b=>b.disabled=true);
  try{
    status.textContent='Перевірка Telegram…';
    await apiPost('/auth',{initData},15000);
    if(!reportDateForUpload){
      reportDateForUpload=new Intl.DateTimeFormat('uk-UA',{
        timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric'
      }).format(new Date());
    }
    if(!reportIdForUpload){
      reportIdForUpload=crypto.randomUUID().replace(/-/g,'');
    }
    // Ідентифікатори створюються до початку відправлення, а не при кожній спробі.
    files.forEach(item=>{item.uploadId=uploadIdFor(item.key,item.file)});
    const pending=files.filter(item=>uploadedFiles.get(item.key)!==item.file);
    let completed=files.length-pending.length;
    let nextIndex=0;
    const errors=[];
    const updateStatus=(message='')=>{
      status.textContent=`Збережено ${completed} із ${files.length} фото. До ${PARALLEL_UPLOADS} одночасних завантажень. ${message}`;
    };
    updateStatus('Не закривайте Telegram.');
    async function uploadWorker(){
      while(nextIndex<pending.length){
        const item=pending[nextIndex++];
        const {file,step,number,key,uploadId}=item;
        const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').slice(0,8)||'jpg';
        const fileName=`Етап_${step}_Фото_${number}.${ext}`;
        let lastError;
        try{
          const prepared=await preparePhoto(file,step);
          if(prepared.size>8*1024*1024||4*Math.ceil(prepared.size/3)>11000000){
            throw new Error('Файл перевищує ліміт передавання (близько 7,8 МБ)');
          }
          const base64Data=await fileToBase64(prepared);
          const uploadFileName=prepared===file?fileName:`Етап_${step}_Фото_${number}.jpg`;
          for(let attempt=1;attempt<=MAX_ATTEMPTS;attempt++){
            try{
              await apiPost('/upload',{
                initData,storeName:label(state.store),reportDate:reportDateForUpload,
                fileName:uploadFileName,mimeType:prepared.type||'image/jpeg',uploadId,base64Data
              });
              uploadedFiles.set(key,file);
              completed++;
              updateStatus('Не закривайте Telegram.');
              lastError=null;
              break;
            }catch(error){
              lastError=error;
              if(!error.retryable||attempt===MAX_ATTEMPTS)break;
              updateStatus(`Повторна спроба для фото ${number} (етап ${step})…`);
              await wait(1500*Math.pow(2,attempt-1)+Math.random()*800);
            }
          }
        }catch(error){lastError=error}
        if(lastError)errors.push(`Етап ${step}, фото ${number}: ${lastError.message}`);
      }
    }
    await Promise.all(Array.from({length:Math.min(PARALLEL_UPLOADS,pending.length)},()=>uploadWorker()));
    if(errors.length){
      status.textContent=`Збережено ${completed} із ${files.length}. Не підтверджено ${errors.length} фото. ${errors[0]} Повторна спроба використовуватиме ті самі ідентифікатори. Не закривайте сторінку.`;
      button.textContent='Повторити непідтверджені';
    }else{
      // Усі фото підтверджені Google Drive. Реєструємо один завершений звіт.
      // При повторі використовуємо той самий reportId, щоб не збільшувати лічильник двічі.
      status.textContent='Усі фотографії збережено. Реєструємо фотозвіт у Google Таблиці…';
      try{
        await apiPost('/complete',{
          initData,
          action:'completeReport',
          reportId:reportIdForUpload,
          apid:String(state.store.id),
          storeName:label(state.store),
          reportDate:reportDateForUpload
        });
        state.screen='done';
        render();
      }catch(error){
        status.textContent=`Усі ${files.length} фото збережено на Google Drive, але реєстрацію в таблиці не підтверджено: ${error.message}. Натисніть кнопку повторно. Фотографії не завантажуватимуться вдруге.`;
        button.textContent='Повторити реєстрацію звіту';
      }
    }
  }catch(error){
    status.textContent=`Не вдалося виконати запит: ${error.message}`;
  }finally{
    uploadInProgress=false;
    if(state.screen==='review'){
      button.disabled=false;back.disabled=false;
      root.querySelectorAll('[data-edit]').forEach(b=>b.disabled=false);
    }
  }
}

function showStores(query){const q=query.trim().toLocaleLowerCase();const matches=STORES.filter(s=>label(s).toLocaleLowerCase().includes(q)).sort((a,b)=>label(a).localeCompare(label(b),'uk'));const el=document.getElementById('storeResults');el.innerHTML=matches.map(s=>`<button type="button" data-id="${s.id}">${esc(label(s))}</button>`).join('')||'<p class="muted" style="padding:10px">Магазин не знайдено</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.store=STORES.find(s=>s.id===b.dataset.id);document.getElementById('storeSearch').value=label(state.store);document.getElementById('selected').classList.remove('hidden');document.getElementById('selected').textContent=label(state.store);document.getElementById('goRules').disabled=false;el.innerHTML=''});}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}render();
</script></body></html>
