<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Materials Order</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20242a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:auto;padding:20px 16px 45px}h1{font-size:23px;margin:8px 0 5px}.muted{color:#697586;font-size:13px}.panel{background:white;border-radius:17px;padding:17px;margin:16px 0;box-shadow:0 2px 12px #1b2b4310}label{display:block;font-size:13px;font-weight:650;margin:15px 0 7px}select,input,textarea{width:100%;padding:13px;border:1px solid #d7dce4;border-radius:10px;background:white;font:inherit}button{cursor:pointer;font:inherit}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#1677ed;color:white;font-weight:700;margin-top:15px}.secondary{background:#eef3fb;color:#195ea5;border:0;border-radius:10px;padding:11px 15px}.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e8edf3}.item:last-child{border:0}.photo{height:75px;width:75px;border-radius:12px;background:#eef3f9;display:flex;align-items:center;justify-content:center;font-size:35px;flex-shrink:0}.itembody{flex:1}.itemname{font-weight:650;font-size:14px}.qty{display:flex;gap:12px;align-items:center;margin-top:10px}.qty button{border:1px solid #d4deeb;background:#f7faff;width:32px;height:32px;border-radius:9px;font-size:20px}.hidden{display:none}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#e8f7ef;color:#137a45;padding:5px 9px;border-radius:20px;font-size:11px}.summary{white-space:pre-line;line-height:1.65;font-size:14px}.notice{font-size:12px;color:#7c5d15;background:#fff5d7;border-radius:10px;padding:10px;margin-top:14px}</style></head><body><main class="wrap"><div class="row"><div><div class="muted">Telegram Mini App · Демоверсія</div><h1>Замовлення матеріалів</h1></div><span class="pill">DEMO</span></div><section id="step1" class="panel"><h3>1. Магазин і бренд-зона</h3><label>Дата замовлення</label><input id="date" disabled><label>Магазин</label><select id="store"><option>COMFY LAVYNA</option><option>FOXTROT LAVYNA</option><option>ALLO RETROVILLE</option></select><label>Тип бренд-зони</label><select id="zone"><option>White Plus</option><option>Multi AAR</option></select><button class="primary" onclick="go(2)">Перейти до каталогу →</button></section><section id="step2" class="panel hidden"><h3>2. Оберіть обладнання</h3><p class="muted" id="catalogHint"></p><div id="catalog"></div><div class="row" style="margin-top:15px"><strong>У кошику:</strong><strong id="total">0 шт.</strong></div><button class="primary" onclick="go(3)">Оформити замовлення →</button><button class="secondary" style="margin-top:10px" onclick="go(1)">← Назад</button></section><section id="step3" class="panel hidden"><h3>3. Дані для відправки</h3><form id="orderForm"><label>ПІБ отримувача</label><input id="fio" required placeholder="Прізвище Ім’я"><label>Телефон</label><input id="phone" required type="tel" placeholder="099 000 00 00"><label>Місто</label><input id="city" required placeholder="Київ"><label>Відділення Нової пошти</label><input id="branch" required placeholder="25"><label>Коментар</label><textarea id="comment" rows="2" placeholder="Необов’язково"></textarea><button class="primary" type="submit">Переглянути замовлення</button></form><button class="secondary" style="margin-top:10px" onclick="go(2)">← Назад</button></section><section id="step4" class="panel hidden"><h3>Замовлення сформовано ✓</h3><div class="summary" id="summary"></div><div class="notice">Це демонстрація. Дані ще не надсилаються до Google Таблиці. Підключення буде наступним етапом.</div><button class="primary" onclick="go(1)">Нове замовлення</button></section></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API_URL='https://script.google.com/macros/s/AKfycbyEVTfPAQzJRSpOIsS6J_cgTAELhnZem85BMvf_lTVcWGYTNxfE1gFH1lwmBWrYkm7i/exec';const products={'White Plus':[{name:'Стійка тримач для iPhone',icon:'📱'},{name:'Кабель сигналізації Apple Pencil',icon:'🔌'},{name:'Наклейка на тримач для iPhone',icon:'🏷️'}],'Multi AAR':[{name:'Кабель сигналізації iPhone',icon:'🔌'},{name:'Кріплення для iPad',icon:'📱'},{name:'Тримач Apple Watch',icon:'⌚'}]};let quantities={};const $=id=>document.getElementById(id);$('date').value=new Date().toLocaleDateString('uk-UA');$('zone').addEventListener('change',()=>{quantities={};render()});function render(){const z=$('zone').value;$('catalogHint').textContent='Матеріали для '+z;$('catalog').replaceChildren();products[z].forEach((p,i)=>{const n=quantities[i]||0;const row=document.createElement('div');row.className='item';const photo=document.createElement('div');photo.className='photo';photo.textContent=p.icon;const body=document.createElement('div');body.className='itembody';const name=document.createElement('div');name.className='itemname';name.textContent=p.name;const controls=document.createElement('div');controls.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>change(i,-1);const value=document.createElement('strong');value.textContent=n;const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>change(i,1);controls.append(minus,value,plus);body.append(name,controls);row.append(photo,body);$('catalog').append(row)});$('total').textContent=Object.values(quantities).reduce((a,b)=>a+b,0)+' шт.'}function change(i,d){quantities[i]=Math.max(0,(quantities[i]||0)+d);render()}function go(step){if(step===3&&!Object.values(quantities).some(v=>v>0)){alert('Додайте хоча б один матеріал');return}for(let i=1;i<=4;i++)$('step'+i).classList.toggle('hidden',i!==step);if(step===2)render();window.scrollTo(0,0)}$('orderForm').addEventListener('submit',e=>{e.preventDefault();const selected=products[$('zone').value].filter((p,i)=>(quantities[i]||0)>0).map(p=>p.name+' — '+quantities[products[$('zone').value].indexOf(p)]+' шт.').join('\n');$('summary').textContent='Дата: '+$('date').value+'\nМагазин: '+$('store').value+'\nБренд-зона: '+$('zone').value+'\n\nОбладнання:\n'+selected+'\n\nПІБ: '+$('fio').value+'\nТелефон: '+$('phone').value+'\nМісто: '+$('city').value+'\nНП: '+$('branch').value+'\nКоментар: '+($('comment').value||'—');go(4)});

async function sendOrder() {
  const items = products[$('zone').value]
    .map((p, i) => ({
      name: p.name,
      quantity: quantities[i] || 0
    }))
    .filter(item => item.quantity > 0);

  const data = {
    store: $('store').value,
    zone: $('zone').value,
    items: items,
    name: $('fio').value,
    phone: $('phone').value,
    city: $('city').value,
    branch: $('branch').value,
    comment: $('comment').value
  };

  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain'
      },
      body: JSON.stringify(data)
    });

    alert('Запит на відправлення передано. Перевір Google Таблицю.');
  } catch (error) {
    alert('Помилка відправлення: ' + error.message);
  }
}
</script></body></html>
