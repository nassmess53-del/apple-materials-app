// Дата тестової перевірки — дата звіту, якщо вже зафіксована,
// або поточна календарна дата в Україні.
function aiReportDate(){
 return state.reportDate || new Intl.DateTimeFormat('uk-UA',{
  timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric'
 }).format(new Date());
}
function parseAiDate(value,reportYear){
 if(value==null||String(value).trim()==='')return {date:null,missing:true};
 const text=String(value).trim();
 const m=text.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{4}))?\.?$/);
 if(!m)return {date:null,missing:false};
 const day=Number(m[1]),month=Number(m[2]),year=m[3]?Number(m[3]):reportYear;
 const d=new Date(Date.UTC(year,month-1,day));
 if(d.getUTCFullYear()!==year||d.getUTCMonth()!==month-1||d.getUTCDate()!==day)return {date:null,missing:false};
 return {date:d,missing:false,yearExplicit:!!m[3]};
}
function checkAiA5(item,dateText){
 const m=dateText.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
 if(!m)return 'Потрібна ручна перевірка: дата звіту невідома';
 const report=new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));
 const start=parseAiDate(item.startDate,+m[3]);
 const end=parseAiDate(item.endDate,+m[3]);
 if(!start.date&&!end.date)return 'Потрібна ручна перевірка: дату акції не розпізнано';
 if((!start.missing&&!start.date)||(!end.missing&&!end.date))return 'Потрібна ручна перевірка: некоректна дата';
 if(String(item.confidence||'').toLowerCase()!=='high')return 'Потрібна ручна перевірка: недостатня впевненість Gemini';
 // Без явно вказаного року перехід грудень/січень неоднозначний.
 if(start.date&&end.date&&start.date>end.date)return 'Потрібна ручна перевірка: неоднозначний період';
 if(start.date&&report<start.date)return 'Неактуальна — акція ще не почалася. Приберіть або замініть А5';
 if(end.date&&report>end.date)return 'Неактуальна — термін акції минув. Приберіть або замініть А5';
 return 'Актуальна';
}
// У тесті та у звіті фото передаються Gemini парами в межах однієї категорії.
async function analyzePromoGroup(group,initData){
 const images=[];
 for(const photo of group){
  const prepared=await preparePhoto(photo.file,photo.step);
  if(prepared.size>8*1024*1024)throw new Error('Фото перевищує ліміт аналізу');
  images.push({mimeType:prepared.type||'image/jpeg',base64Data:await fileToBase64Promo(prepared)});
 }
 // Worker приймає до 12 МБ JSON. Великі пари безпечно перевіряємо по одному.
 const totalBase64=images.reduce((n,x)=>n+x.base64Data.length,0);
 if(images.length===2 && totalBase64>10800000){
  const left=await analyzePromoGroup([group[0]],initData);
  const right=await analyzePromoGroup([group[1]],initData);
  return [{photo:group[0],items:left[0].items,usage:left[0].usage},{photo:group[1],items:right[0].items,usage:right[0].usage}];
 }
 const answer=await apiPostPromo('/promo/ai-test',{
  initData,photoCategory:group[0].step===1?'a5_graphic':'price_tag',images
 },59000);
 if(!Array.isArray(answer.results)||answer.results.length!==group.length)throw new Error('Gemini повернув неповну відповідь');
 return group.map((photo,i)=>({photo,items:answer.results[i].items, warnings:answer.results[i].warnings||[],usage:i===0?answer.usage:null}));
}
function promoGroups(photos){
 const result=[];
 for(const step of [1,2]){
  const group=photos.filter(p=>p.step===step);
  for(let i=0;i<group.length;i+=2)result.push(group.slice(i,i+2));
 }
 return result;
}

 const groups=promoGroups(photos);button.disabled=true;result.hidden=false;
 const lines=[`Дата фотозвіту: ${aiReportDate()}`];let ok=0,failed=0,itemsCount=0;
 const tokens={input:0,output:0,total:0};
 try{
  for(let i=0;i<groups.length;i++){
   const group=groups[i];result.textContent=lines.join('\n\n')+`\n\nПеревірка групи ${i+1} із ${groups.length} (${group.length} фото)…`;
   try{
    const rows=await analyzePromoGroup(group,initData);
    for(const row of rows){
     ok++;itemsCount+=row.items.length;
     const heading=`${row.photo.step===1?'А5':'Цінники'}, фото ${row.photo.number}`;
     const details=row.items.map((x,j)=>row.photo.step===1?
      `${j+1}. ${x.model||'Модель невідома'} | ${x.startDate||'—'} — ${x.endDate||'—'} | ${checkAiA5(x,aiReportDate())}`:
      `${j+1}. ${x.model||'Модель невідома'} | ${x.priceUah??'Ціна невідома'} грн`);
     lines.push(`✓ ${heading}\nРозпізнано: ${row.items.length}${details.length?'\n'+details.join('\n'):''}`);
     if(row.usage){tokens.input+=row.usage.inputTokens||0;tokens.output+=row.usage.outputTokens||0;tokens.total+=row.usage.totalTokens||0}
    }
   }catch(e){failed+=group.length;group.forEach(p=>lines.push(`✕ Етап ${p.step}, фото ${p.number}: ${e.message}`));if(e.status===429)break}
  }
  lines.push(`ПІДСУМОК\nУспішно: ${ok} фото\nПомилки: ${failed} фото\nПозицій: ${itemsCount}\nТокени: вхідні ${tokens.input}, вихідні ${tokens.output}, усього ${tokens.total}`);
  result.textContent=lines.join('\n\n');
 }finally{button.disabled=false}
}

// Параметри якості. 0.90 — якість JPEG, а не зменшення розміру на 90%.
const PHOTO_MAX_WIDTH=3024;
const PHOTO_MAX_HEIGHT=2268;
const PHOTO_JPEG_QUALITY=0.90;
const preparedPhotoCache=new WeakMap();

// Етапи 1–3 та 5 оптимізуються. Close-up (4) і DCOTA (6) — оригінали.
async function preparePhoto(file,step){
  if(step===4||step===6||!['image/jpeg','image/png','image/webp'].includes(file.type))return file;
  if(preparedPhotoCache.has(file))return preparedPhotoCache.get(file);
  const task=(async()=>{
    let bitmap;
    try{
      bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
      const scale=Math.min(1,PHOTO_MAX_WIDTH/bitmap.width,PHOTO_MAX_HEIGHT/bitmap.height);
      if(scale>=1)return file;
      const width=Math.max(1,Math.round(bitmap.width*scale));
      const height=Math.max(1,Math.round(bitmap.height*scale));
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      if(!ctx)throw new Error('Canvas недоступний');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(bitmap,0,0,width,height);
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(
        result=>result?resolve(result):reject(new Error('Не вдалося підготувати JPEG')),
        'image/jpeg',PHOTO_JPEG_QUALITY
      ));
      canvas.width=0;canvas.height=0;
      // Якщо оптимізація не зменшує файл, зберігаємо оригінал.
      if(blob.size>=file.size)return file;
      return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{
        type:'image/jpeg',lastModified:file.lastModified
      });
    }catch(error){
      console.warn('Оптимізація недоступна, використовується оригінал:',error);
      return file;
    }finally{if(bitmap)bitmap.close()}
  })();
  preparedPhotoCache.set(file,task);
  return task;
}


function getInitData(){return window.Telegram?.WebApp?.initData||''}
function reportDate(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`}
function newId(){return crypto.randomUUID().replace(/-/g,'')}
function base64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(Error('Не вдалося прочитати фото'));r.onload=()=>resolve(String(r.result).split(',')[1]);r.readAsDataURL(file)})}
async function requestPromo(path,data){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
 try{
  const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:getInitData(),...data}),signal:controller.signal});
  const j=await r.json();if(!r.ok||j.success!==true)throw Error(j.error||'Сервер не підтвердив операцію');return j;
 }finally{clearTimeout(timer)}
}
const PARALLEL_UPLOADS=2;
const MAX_ATTEMPTS=3;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const uploadedFiles=new Map();
const uploadIdentifiers=new Map();
function uploadIdFor(key,file){
 const saved=uploadIdentifiers.get(key);
 if(saved&&saved.file===file)return saved.id;
 const id=newId();uploadIdentifiers.set(key,{file,id});uploadedFiles.delete(key);return id;
}
async function sendReport(){
 if(state.uploading)return;
 const initData=getInitData();
 if(!initData){alert('Відкрийте додаток через кнопку Telegram-бота.');return}
 if(!state.store||state.photos.some((a,i)=>a.filter(Boolean).length<(i===0?MIN_A5_PHOTOS:MIN_PHOTOS_PER_SECTION)||a.filter(Boolean).length>MAX_PHOTOS_PER_SECTION))return;
 const files=state.photos.flatMap((a,i)=>a.map((file,j)=>file?{file,step:i+1,number:j+1,key:`${i+1}:${j+1}`}:null).filter(Boolean));
 state.uploading=true;state.error='';state.screen='upload';
 if(!state.reportId){state.reportId=newId();state.reportDate=new Intl.DateTimeFormat('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
 try{
  state.progress='Перевірка Telegram…';render();
  await apiPostPromo('/auth',{initData},15000);
  files.forEach(item=>{item.uploadId=uploadIdFor(item.key,item.file)});
  const pending=files.filter(item=>uploadedFiles.get(item.key)!==item.file);
  let completed=files.length-pending.length,nextIndex=0;
  const errors=[];
  const progress=(message='')=>{state.progress=`Збережено ${completed} із ${files.length} фото. До ${PARALLEL_UPLOADS} одночасних завантажень. ${message}`;render()};
  progress('Не закривайте Telegram.');
  async function uploadWorker(){
   while(nextIndex<pending.length){
    const item=pending[nextIndex++];
    const {file,step,number,key,uploadId}=item;
    let lastError;
    try{
     const prepared=await preparePhoto(file,step);
     if(prepared.size>8*1024*1024||4*Math.ceil(prepared.size/3)>11000000){throw new Error('Файл перевищує ліміт передавання (близько 7,8 МБ)')}
     const base64Data=await fileToBase64Promo(prepared);
     const ext=prepared.type==='image/png'?'png':prepared.type==='image/webp'?'webp':'jpg';
     const fileName=(step===1?'Promo_A5_':'Price_Tag_')+number+'.'+ext;
     for(let attempt=1;attempt<=MAX_ATTEMPTS;attempt++){
      try{
       await apiPostPromo('/promo/upload',{initData,storeName:label(state.store),reportDate:state.reportDate,fileName,mimeType:prepared.type||'image/jpeg',uploadId,base64Data});
       uploadedFiles.set(key,file);completed++;progress('Не закривайте Telegram.');lastError=null;break;
      }catch(error){
       lastError=error;
       if(!error.retryable||attempt===MAX_ATTEMPTS)break;
       progress(`Повторна спроба для фото ${number} (етап ${step})…`);
       await wait(1500*Math.pow(2,attempt-1)+Math.random()*800);
      }
     }
    }catch(error){lastError=error}
    if(lastError)errors.push(`Етап ${step}, фото ${number}: ${lastError.message}`);
   }
  }
  await Promise.all(Array.from({length:Math.min(PARALLEL_UPLOADS,pending.length)},()=>uploadWorker()));
  if(errors.length){
   state.error=`Не підтверджено ${errors.length} фото. ${errors[0]}. Натисніть «Повторити непідтверджені».`;
   progress('');
  }else{
   state.progress='Усі фотографії збережено. Реєструємо фотозвіт у Google Таблиці…';render();
   try{
    const result=await apiPostPromo('/promo/complete',{initData,reportId:state.reportId,apid:String(state.store.id),storeName:label(state.store),reportDate:state.reportDate});
     state.folderUrl=result.folderUrl||'';
     state.progress='Фотографії збережено. Gemini перевіряє А5 та цінники…';render();
     try{
       state.analysisPayload=await collectPromoAnalysis(files,initData);
       state.progress='Записуємо результати перевірки в Google Таблицю…';render();
       await savePromoAnalysisPayload(initData);
       state.analysisSaved=true;
       state.analysisStatus='Перевірку завершено. Результати передано до Google Таблиці.';
     }catch(analysisError){
       state.analysisError=`Фотозвіт збережено, але результати перевірки не підтверджено: ${analysisError.message}`;
       state.analysisStatus='Очікує перевірки. Фотографії повторно завантажувати не потрібно.';
     }
     state.screen='done';
   }catch(error){state.error=`Усі фото збережено, але реєстрацію не підтверджено: ${error.message}. Натисніть повторно — фотографії вдруге не завантажаться.`}
  }
 }catch(error){state.error=`Не вдалося виконати запит: ${error.message}`}
 finally{state.uploading=false;render()}
}
// Аналіз запускається тільки ПІСЛЯ підтвердження збереження фотозвіту.
// Якщо одна фотографія не розпізнана, зберігаємо часткові результати
// й позначаємо звіт як такий, що потребує ручної перевірки.
async function collectPromoAnalysis(files,initData){
 const payload={reportId:state.reportId,apid:String(state.store.id),reportDate:state.reportDate,
  a5Items:[],priceItems:[],photoErrors:[],checkedA5Photos:0,checkedPricePhotos:0,
  totalA5Photos:files.filter(x=>x.step===1).length,totalPricePhotos:files.filter(x=>x.step===2).length};
 const groups=promoGroups(files);
 for(let i=0;i<groups.length;i++){
  const group=groups[i];state.progress=`Фотографії збережено. Перевірка Gemini: група ${i+1} із ${groups.length}…`;render();
  try{
   const rows=await analyzePromoGroup(group,initData);
   for(const {photo,items} of rows){
    if(!Array.isArray(items)||!items.length){payload.photoErrors.push(`Етап ${photo.step}, фото ${photo.number}: позицій не розпізнано`);continue}
    if(photo.step===1){payload.checkedA5Photos++;payload.a5Items.push(...items.map(x=>({model:x.model??null,startDate:x.startDate??null,endDate:x.endDate??null,confidence:x.confidence??'low',note:x.note??''})))}
    else{payload.checkedPricePhotos++;payload.priceItems.push(...items.map(x=>({model:x.model??null,sizeMm:x.sizeMm??null,storageGb:x.storageGb??null,color:x.color??null,priceUah:x.priceUah??null,priceType:x.priceType??'unknown',confidence:x.confidence??'low',note:x.note??''})))}
   }
  }catch(e){
   group.forEach(p=>payload.photoErrors.push(`Етап ${p.step}, фото ${p.number}: ${String(e.message||e).slice(0,180)}`));
   if(e.status===429){for(const rest of groups.slice(i+1))for(const p of rest)payload.photoErrors.push(`Етап ${p.step}, фото ${p.number}: ліміт Gemini`);break}
  }
 }
 return payload;
}

async function savePromoAnalysisPayload(initData){
 if(!state.analysisPayload)throw new Error('Результати аналізу відсутні');
 return apiPostPromo('/promo/analysis-save',{initData,...state.analysisPayload},59000);
}

async function retryPromoAnalysisSave(){
 if(state.uploading||!state.analysisPayload)return;
 state.uploading=true;state.analysisError='';state.screen='upload';
 state.progress='Повторюємо запис результатів у Google Таблицю…';render();
 try{
  await savePromoAnalysisPayload(getInitData());
  state.analysisSaved=true;
  state.analysisStatus='Результати передано до Google Таблиці.';
 }catch(error){state.analysisError=`Не вдалося записати результати: ${error.message}`}
 finally{state.uploading=false;state.screen='done';render()}
}

function fileToBase64Promo(file){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Не вдалося прочитати файл'));reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)})
}
async function apiPostPromo(path,payload,timeoutMs=55000){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
  let data;try{data=await response.json()}catch{throw Object.assign(new Error('Сервер повернув некоректну відповідь'),{retryable:response.status>=500})}
  if(!response.ok||!data.success)throw Object.assign(new Error(data.error||`Помилка сервера (${response.status})`),{retryable:data.retryable===true||response.status===429||response.status>=500,status:response.status});
  return data;
 }catch(error){
  if(error.name==='AbortError')throw Object.assign(new Error('Час очікування відповіді минув'),{retryable:true});
  if(error instanceof TypeError)throw Object.assign(new Error('Помилка мережі'),{retryable:true});
  throw error;
 }finally{clearTimeout(timer)}
}

function showStores(query){const q=query.trim().toLocaleLowerCase();const matches=STORES.filter(s=>label(s).toLocaleLowerCase().includes(q)).sort((a,b)=>label(a).localeCompare(label(b),'uk'));const el=document.getElementById('storeResults');el.innerHTML=matches.map(s=>`<button type="button" data-id="${s.id}">${esc(label(s))}</button>`).join('')||'<p class="muted">Магазин не знайдено</p>';el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.store=STORES.find(s=>s.id===b.dataset.id);document.getElementById('search').value=label(state.store);document.getElementById('selected').textContent=label(state.store);document.getElementById('next').disabled=false;el.innerHTML=''})}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}render();
