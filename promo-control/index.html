// Формуємо дату для Worker тільки ASCII-цифрами і крапками, незалежно від локалі iPhone.
function promoKyivDate(){
 const parts=new Intl.DateTimeFormat('en-GB',{
  timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',year:'numeric'
 }).formatToParts(new Date());
 const values=Object.fromEntries(parts.filter(p=>['day','month','year'].includes(p.type)).map(p=>[p.type,p.value]));
 return `${values.day}.${values.month}.${values.year}`;

function promoDisplayCategory(model){
 const n=String(model||'').toLowerCase();
 // Комплект Apple Watch із ремінцем є годинником, а не окремим аксесуаром.
 if(/^(?:apple\s+)?watch\s*(?:series|ultra|se)\b/i.test(n.trim()))return 'Apple Watch';
 if(/\b(case|cover|folio|keyboard|mouse|trackpad|pencil|charger|adapter|cable|strap|band|wallet|magsafe|smart connector|sleeve)\b|чохол|клавіатур|мишк|олівець|заряд|кабел|ремінець/i.test(n))return 'Аксесуари';
 if(/iphone/i.test(n))return 'iPhone';
 if(/ipad/i.test(n))return 'iPad';
 if(/macbook/i.test(n))return 'MacBook';
 if(/apple\s*watch|watch\s*(series|ultra|se)/i.test(n))return 'Apple Watch';
 if(/imac|\bmac\b|studio\s*display|pro\s*display/i.test(n))return 'Mac';
 if(/airpods/i.test(n))return 'AirPods';
 return 'Інші позиції';
}

function parseAiDate(value,reportYear){
 if(value==null||String(value).trim()==='')return {date:null,missing:true};
 const text=String(value).trim();
 const m=text.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{4}))?\.?$/);
 if(!m)return {date:null,missing:false};
 const day=Number(m[1]),month=Number(m[2]),year=m[3]?Number(m[3]):reportYear;
 const d=new Date(Date.UTC(year,month-1,day));
 if(d.getUTCFullYear()!==year||d.getUTCMonth()!==month-1||d.getUTCDate()!==day)return {date:null,missing:false};
 return {date:d,missing:false,yearExplicit:!!m[3]};
}
function checkAiA5(item,dateText){
 const m=dateText.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
 if(!m)return 'Потрібна ручна перевірка: дата звіту невідома';
 const report=new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));
 const start=parseAiDate(item.startDate,+m[3]);
 const end=parseAiDate(item.endDate,+m[3]);
 if(!start.date&&!end.date)return 'Потрібна ручна перевірка: дату акції не розпізнано';
 if((!start.missing&&!start.date)||(!end.missing&&!end.date))return 'Потрібна ручна перевірка: некоректна дата';
 if(String(item.confidence||'').toLowerCase()!=='high')return 'Потрібна ручна перевірка: дані на фото розпізнано неоднозначно';
 // Без явно вказаного року перехід грудень/січень неоднозначний.
 if(start.date&&end.date&&start.date>end.date)return 'Потрібна ручна перевірка: неоднозначний період';
 if(start.date&&report<start.date)return 'Неактуальна — акція ще не почалася. Приберіть або замініть А5';
 if(end.date&&report>end.date)return 'Неактуальна — термін акції минув. Приберіть або замініть А5';
 return 'Актуальна';
}
// У тесті та у звіті фото передаються Gemini парами в межах однієї категорії.
async function analyzePromoGroup(group,initData){
 const images=[];
 for(const photo of group){
  const prepared=await preparePhoto(photo.file,photo.step);
  if(prepared.size>8*1024*1024)throw new Error('Фото перевищує ліміт аналізу');
  images.push({mimeType:prepared.type||'image/jpeg',base64Data:await fileToBase64Promo(prepared)});
 }
 // Worker приймає до 12 МБ JSON. Великі пари безпечно перевіряємо по одному.
 const totalBase64=images.reduce((n,x)=>n+x.base64Data.length,0);
 if(images.length===2 && totalBase64>10800000){
  const left=await analyzePromoGroup([group[0]],initData);
  const right=await analyzePromoGroup([group[1]],initData);
  return [{photo:group[0],items:left[0].items,usage:left[0].usage},{photo:group[1],items:right[0].items,usage:right[0].usage}];
 }
 const callId=newId();
 let answer;
 try{
  answer=await apiPostPromo('/promo/ai-test',{
   initData,photoCategory:group[0].step===1?'a5_graphic':'price_tag',images
  },59000);
  recordGeminiUsage(callId,answer);
 }catch(error){
  recordGeminiUsage(callId,error.usageInfo||null,true);
  throw error;
 }
 if(!Array.isArray(answer.results)||answer.results.length!==group.length)throw new Error('Не вдалося повністю перевірити фотографії');
 return group.map((photo,i)=>({photo,items:answer.results[i].items, warnings:answer.results[i].warnings||[],usage:i===0?answer.usage:null}));
}
// Накопичуємо підтверджені токени кожного звернення до Gemini,
// навіть якщо фотографію згодом замінено.
function recordGeminiUsage(callId, response, failed=false){
 if(recordedGeminiCalls.has(callId))return;
 recordedGeminiCalls.add(callId);
 const usage=response?.usageAllAttempts||response?.usage||{};
 const count=Number.isSafeInteger(response?.attempts)?response.attempts:1;
 const reported=Number.isSafeInteger(response?.usageReports)?response.usageReports:(response?.usage?1:0);
 const totals=state.tokenUsage;
 for(const field of ['inputTokens','outputTokens','thinkingTokens','totalTokens']){
  const value=usage[field];
  if(Number.isSafeInteger(value)&&value>=0)totals[field]+=value;
 }
 totals.apiRequests+=count;
 totals.retries+=Math.max(0,count-1);
 if(reported<count||failed&&reported===0||!response)totals.incomplete=true;
}

// Параметри якості. 0.90 — якість JPEG, а не зменшення розміру на 90%.
const PHOTO_MAX_WIDTH=3024;
const PHOTO_MAX_HEIGHT=2268;
const PHOTO_JPEG_QUALITY=0.90;
const preparedPhotoCache=new WeakMap();

// Етапи 1–3 та 5 оптимізуються. Close-up (4) і DCOTA (6) — оригінали.
async function preparePhoto(file,step){
  if(step===4||step===6||!['image/jpeg','image/png','image/webp'].includes(file.type))return file;
  if(preparedPhotoCache.has(file))return preparedPhotoCache.get(file);
  const task=(async()=>{
    let bitmap;
    try{
      bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
      const scale=Math.min(1,PHOTO_MAX_WIDTH/bitmap.width,PHOTO_MAX_HEIGHT/bitmap.height);
      if(scale>=1)return file;
      const width=Math.max(1,Math.round(bitmap.width*scale));
      const height=Math.max(1,Math.round(bitmap.height*scale));
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      if(!ctx)throw new Error('Canvas недоступний');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(bitmap,0,0,width,height);
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(
        result=>result?resolve(result):reject(new Error('Не вдалося підготувати фотографію')),
        'image/jpeg',PHOTO_JPEG_QUALITY
      ));
      canvas.width=0;canvas.height=0;
      // Якщо оптимізація не зменшує файл, зберігаємо оригінал.
      if(blob.size>=file.size)return file;
      return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{
        type:'image/jpeg',lastModified:file.lastModified
      });
    }catch(error){
      console.warn('Оптимізація недоступна, використовується оригінал:',error);
      return file;
    }finally{if(bitmap)bitmap.close()}
  })();
  preparedPhotoCache.set(file,task);
  return task;
}

const PARALLEL_UPLOADS=2;
const MAX_ATTEMPTS=3;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const uploadedFiles=new Map();
const uploadIdentifiers=new Map();
function uploadIdFor(key,file){
 const saved=uploadIdentifiers.get(key);
 if(saved&&saved.file===file)return saved.id;
 const id=newId();uploadIdentifiers.set(key,{file,id});uploadedFiles.delete(key);return id;
}
async function sendReport(){
 if(state.uploading)return;
 if(!allPromoPhotosReady()){alert('Спочатку перевірте читабельність усіх фотографій.');return;}
 const initData=getInitData();
 if(!initData){alert('Відкрийте додаток через кнопку Telegram-бота.');return}
 if(!promoSelectionReady()||state.photos.some((a,i)=>a.filter(Boolean).length<(i===0?MIN_A5_PHOTOS:MIN_PHOTOS_PER_SECTION)||a.filter(Boolean).length>MAX_PHOTOS_PER_SECTION))return;
 const files=state.photos.flatMap((a,i)=>a.map((file,j)=>file?{file,step:i+1,number:j+1,key:`${i+1}:${j+1}`}:null).filter(Boolean));
 state.uploading=true;state.error='';state.screen='upload';
 if(!state.reportId){state.reportId=newId();state.reportDate=promoKyivDate()}
 try{
  state.progress='Готуємо фотозвіт до надсилання…';render();
  await apiPostPromo('/auth',{initData},15000);
  files.forEach(item=>{item.uploadId=uploadIdFor(item.key,item.file)});
  const pending=files.filter(item=>uploadedFiles.get(item.key)!==item.file);
  let completed=files.length-pending.length,nextIndex=0;
  const errors=[];
  const progress=(message='')=>{state.progress=`Завантажено ${completed} із ${files.length} фотографій. ${message}`;render()};
  progress('');
  async function uploadWorker(){
   while(nextIndex<pending.length){
    const item=pending[nextIndex++];
    const {file,step,number,key,uploadId}=item;
    let lastError;
    try{
     const prepared=await preparePhoto(file,step);
     if(prepared.size>8*1024*1024||4*Math.ceil(prepared.size/3)>11000000){throw new Error('Файл перевищує ліміт передавання (близько 7,8 МБ)')}
     const base64Data=await fileToBase64Promo(prepared);
     const ext=prepared.type==='image/png'?'png':prepared.type==='image/webp'?'webp':'jpg';
     const fileName=(step===1?'Promo_A5_':'Price_Tag_')+number+'.'+ext;
     for(let attempt=1;attempt<=MAX_ATTEMPTS;attempt++){
      try{
       await apiPostPromo('/promo/upload',{initData,storeName:label(state.store),reportDate:state.reportDate,fileName,mimeType:prepared.type||'image/jpeg',uploadId,base64Data});
       uploadedFiles.set(key,file);completed++;progress('');lastError=null;break;
      }catch(error){
       lastError=error;
       if(!error.retryable||attempt===MAX_ATTEMPTS)break;
       progress(`Повторюємо надсилання фотографії №${number}…`);
       await wait(1500*Math.pow(2,attempt-1)+Math.random()*800);
      }
     }
    }catch(error){lastError=error}
    if(lastError)errors.push(`Етап ${step}, фото ${number}: ${lastError.message}`);
   }
  }
  await Promise.all(Array.from({length:Math.min(PARALLEL_UPLOADS,pending.length)},()=>uploadWorker()));
  if(errors.length){
   console.error('Помилки фотографій:',errors);state.error=`Не вдалося підтвердити ${errors.length} фотографій. Натисніть «Повторити надсилання».`;
   progress('');
  }else{
   state.progress='Усі фотографії завантажено. Зберігаємо фотозвіт…';render();
   try{
    const result=await apiPostPromo('/promo/complete',{initData,reportId:state.reportId,apid:String(state.store.id),storeName:label(state.store),reportDate:state.reportDate,employee:state.employee});
     state.folderUrl=result.folderUrl||'';
     state.progress='Перевіряємо фотографії…';render();
     try{
       state.analysisPayload=await collectPromoAnalysis(files,initData);
       state.progress='Зберігаємо результати перевірки…';render();
       await savePromoAnalysisPayload(initData);
       state.analysisSaved=true;
       state.analysisStatus='Перевірку завершено. Результати збережено.';
     }catch(analysisError){
       console.error('Помилка збереження результатів:',analysisError);state.analysisError='Фотозвіт збережено, але результати перевірки поки не підтверджено. Спробуйте повторити збереження.';
       state.analysisStatus='Результати ще зберігаються. Повторно надсилати фотографії не потрібно.';
     }
     try{
      state.progress='Завершуємо обробку звіту…';render();
      await savePromoTokenUsagePayload(initData);
     }catch(tokenError){
      console.error('Помилка статистики:',tokenError);state.tokenUsageError='Звіт збережено, але завершення обробки не підтверджено. Спробуйте ще раз.';
     }
     state.screen='done';
   }catch(error){console.error('Помилка реєстрації:',error);state.error='Фотографії завантажено, але завершення надсилання не підтверджено. Спробуйте ще раз — фотографії повторно не завантажуватимуться.'}
  }
 }catch(error){console.error('Помилка надсилання:',error);state.error='Не вдалося завершити надсилання. Перевірте з’єднання та спробуйте ще раз.'}
 finally{state.uploading=false;render()}
}
// Аналіз запускається тільки ПІСЛЯ підтвердження збереження фотозвіту.
// Якщо одна фотографія не розпізнана, зберігаємо часткові результати
// й позначаємо звіт як такий, що потребує ручної перевірки.
async function collectPromoAnalysis(files,initData){
 // НЕ викликаємо Gemini: використовуємо лише результати попередньої перевірки.
 const payload={reportId:state.reportId,apid:String(state.store.id),reportDate:state.reportDate,
  a5Items:[],priceItems:[],photoErrors:[],checkedA5Photos:0,checkedPricePhotos:0,
  totalA5Photos:files.filter(x=>x.step===1).length,totalPricePhotos:files.filter(x=>x.step===2).length};
 for(const photo of files){
  const cached=promoPrecheckCache.get(photo.file);
  if(!cached||cached.status!=='ok')throw new Error(`Фото ${photo.number} (етап ${photo.step}) не пройшло перевірку`);
  const items=cached.items;
  if(photo.step===1){
   payload.checkedA5Photos++;
   payload.a5Items.push(...items.map(x=>({model:x.model??null,startDate:x.startDate??null,endDate:x.endDate??null,confidence:x.confidence??'low',note:x.note??''})));
  }else{
   payload.checkedPricePhotos++;
   payload.priceItems.push(...items.map(x=>({model:x.model??null,sizeMm:x.sizeMm??null,storageGb:x.storageGb??null,color:x.color??null,priceUah:x.priceUah??null,priceType:x.priceType??'unknown',confidence:x.confidence??'low',note:x.note??''})));
  }
 }
 return payload;
}

 if(!state.analysisPayload)throw new Error('Результати аналізу відсутні');
 return apiPostPromo('/promo/analysis-save',{initData,...state.analysisPayload},70000);
}

function fileToBase64Promo(file){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Не вдалося прочитати файл'));reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)})
}
async function apiPostPromo(path,payload,timeoutMs=70000){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
  let data;try{data=await response.json()}catch{throw Object.assign(new Error('Не вдалося отримати підтвердження. Спробуйте ще раз'),{retryable:response.status>=500})}
  if(!response.ok||!data.success)throw Object.assign(new Error(data.error||`Тимчасова помилка під час обробки запиту`),{retryable:data.retryable===true||response.status===429||response.status>=500,status:response.status,usageInfo:data});
  return data;
 }catch(error){
  if(error.name==='AbortError')throw Object.assign(new Error('Час очікування відповіді минув'),{retryable:true});
  if(error instanceof TypeError)throw Object.assign(new Error('Помилка мережі'),{retryable:true});
  throw error;
 }finally{clearTimeout(timer)}
}

function promoSelectionReady(){return employeeDirectory.status==='ready'&&employeeDirectory.names.includes(state.employee)&&!!state.store}
function normalizePromoEmployees(names){
 if(!Array.isArray(names))throw new Error('Некоректний формат довідника співробітників.');
 const unique=new Map();
 for(const raw of names){if(typeof raw!=='string')continue;const name=raw.trim();if(name&&!unique.has(name.toLocaleLowerCase('uk')))unique.set(name.toLocaleLowerCase('uk'),name)}
 const list=[...unique.values()].sort((a,b)=>a.localeCompare(b,'uk'));
 if(!list.length)throw new Error('Список співробітників порожній.');
 return list;
}
async function loadPromoEmployees(){
 if(employeeDirectory.status==='loading')return;
 employeeDirectory.status='loading';employeeDirectory.error='';if(state.screen==='store')render();
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
 try{
  const initData=getInitData();if(!initData)throw new Error('Відкрийте застосунок через Telegram-бота.');
  const response=await fetch(EMPLOYEE_DIRECTORY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData}),signal:controller.signal});
  const result=await response.json();if(!response.ok||result.ok!==true)throw new Error('Не вдалося завантажити список співробітників.');
  employeeDirectory.names=normalizePromoEmployees(result.employees);
  employeeDirectory.status='ready';
  if(!employeeDirectory.names.includes(state.employee)){state.employee='';state.store=null}
 }catch(error){employeeDirectory.status='error';employeeDirectory.error=error.name==='AbortError'?'Час очікування списку співробітників вичерпано.':(error.message||'Не вдалося завантажити список співробітників.');}
 finally{clearTimeout(timer);if(state.screen==='store')render()}
}
function showStores(query){
 const el=document.getElementById('storeResults');if(!state.employee){el.hidden=true;return}
 const q=query.trim().toLocaleLowerCase();const matches=STORES.filter(s=>label(s).toLocaleLowerCase().includes(q)).sort((a,b)=>label(a).localeCompare(label(b),'uk'));
 el.hidden=false;el.innerHTML=matches.map(s=>`<button type="button" data-id="${esc(s.id)}">${esc(label(s))}</button>`).join('')||'<p class="muted">Магазин не знайдено</p>';
 el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.store=STORES.find(s=>s.id===b.dataset.id);if(!state.store)return;document.getElementById('search').value=label(state.store);document.getElementById('selected').textContent=label(state.store);document.getElementById('next').disabled=!promoSelectionReady();el.innerHTML='';el.hidden=true})
}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}render();
